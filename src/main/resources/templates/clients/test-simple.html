<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Test Clients</title>
</head>
<body>
    <h1>Test Clients</h1>
    
    <div th:if="${clients != null}">
        <p>Nombre de clients: <span th:text="${clients.size()}">0</span></p>
        
        <table border="1">
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Email</th>
            </tr>
            <tr th:each="client : ${clients}">
                <td th:text="${client.id}">1</td>
                <td th:text="${client.nomComplet}">Nom</td>
                <td th:text="${client.email}">email@test.com</td>
            </tr>
        </table>
    </div>
    
    <div th:if="${clients == null}">
        <p>Clients est null!</p>
    </div>
    
</body>
</html>
