<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Clients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Liste des Clients</h1>
        
        <div class="alert alert-info">
            <strong>Total:</strong> <span th:text="${clients.size()}">0</span> client(s) dans la base de données
        </div>
        
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Email</th>
                    <th>Téléphone</th>
                    <th>Ville</th>
                    <th>Statut</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="client : ${clients}">
                    <td th:text="${client.id}">1</td>
                    <td th:text="${client.nom}">Nom</td>
                    <td th:text="${client.prenom}">Prénom</td>
                    <td th:text="${client.email}">email@example.com</td>
                    <td th:text="${client.telephone}">06 12 34 56 78</td>
                    <td th:text="${client.ville}">Ville</td>
                    <td>
                        <span th:if="${client.actif}" class="badge bg-success">Actif</span>
                        <span th:unless="${client.actif}" class="badge bg-danger">Inactif</span>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div th:if="${clients.isEmpty()}" class="alert alert-warning">
            <i class="bi bi-exclamation-triangle"></i> Aucun client trouvé dans la base de données
        </div>
        
        <div class="mt-3">
            <a href="/" class="btn btn-primary">Retour à l'accueil</a>
            <a href="/clients/new" class="btn btn-success">Ajouter un client</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
