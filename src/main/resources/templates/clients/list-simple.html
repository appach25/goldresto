<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Clients - Gold Resto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid mt-4 px-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <i class="bi bi-people me-2"></i>
                Gestion des Clients
                <span class="badge bg-primary ms-2" th:text="${clientPage.totalElements}">0</span>
            </h2>
            
            <div class="d-flex gap-2">
                <a href="/clients/new" class="btn btn-success">
                    <i class="bi bi-plus-circle me-1"></i> Nouveau Client
                </a>
            </div>
        </div>
        
        <!-- Statistiques -->
        <div class="row mb-4">
            <div class="col-md-2">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${stats.totalClients}">0</h5>
                        <p class="card-text">Total Clients</p>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${stats.clientsActifs}">0</h5>
                        <p class="card-text">Clients Actifs</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Liste des clients -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Nom Complet</th>
                                <th>Email</th>
                                <th>Téléphone</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="client : ${clients}">
                                <td>
                                    <strong th:text="${client.nomComplet}">Nom Prénom</strong>
                                </td>
                                <td>
                                    <span th:if="${client.email}" th:text="${client.email}">email@example.com</span>
                                    <span th:unless="${client.email}" class="text-muted">-</span>
                                </td>
                                <td>
                                    <span th:if="${client.telephone}" th:text="${client.telephone}">06 12 34 56 78</span>
                                    <span th:unless="${client.telephone}" class="text-muted">-</span>
                                </td>
                                <td>
                                    <span th:if="${client.actif}" class="badge bg-success">Actif</span>
                                    <span th:unless="${client.actif}" class="badge bg-danger">Inactif</span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm" role="group">
                                        <a th:href="@{/clients/{id}(id=${client.id})}" class="btn btn-outline-primary" title="Voir">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/clients/{id}/edit(id=${client.id})}" class="btn btn-outline-warning" title="Modifier">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${clients.isEmpty()}">
                                <td colspan="5" class="text-center py-4">
                                    <i class="bi bi-people fs-1 text-muted"></i>
                                    <p class="text-muted mt-2">Aucun client trouvé</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
