<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Test Clients - Minimal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Gestion des Clients</h2>
        
        <!-- Test simple stats -->
        <div class="alert alert-info">
            Stats: <span th:text="${stats != null ? 'OK' : 'NULL'}">?</span>
        </div>
        
        <!-- Test simple clientPage -->
        <div class="alert alert-success">
            ClientPage: <span th:text="${clientPage != null ? 'OK' : 'NULL'}">?</span>
        </div>
        
        <!-- Test simple clients -->
        <div class="alert alert-warning">
            Clients: <span th:text="${clients != null ? clients.size() + ' clients' : 'NULL'}">?</span>
        </div>
        
        <!-- Tableau simple -->
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="client : ${clients}">
                    <td th:text="${client.id}">1</td>
                    <td th:text="${client.nom}">Nom</td>
                    <td th:text="${client.email}">email</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
