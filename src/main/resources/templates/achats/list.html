<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Achats Ingrédients - Belasyet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
    <style>
        body { padding-top: 120px !important; }
    </style>
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Achats d'ingrédients</h2>
            <a class="btn btn-primary" href="/achats/new">Nouvel achat</a>
        </div>

        <div class="card">
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Fournisseur</th>
                            <th>Référence facture</th>
                            <th>Total</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="achat : ${achats}">
                            <td th:text="${achat.dateAchat}"></td>
                            <td th:text="${achat.fournisseur}"></td>
                            <td th:text="${achat.referenceFacture}"></td>
                            <td th:text="${#numbers.formatDecimal(achat.total, 1, 2)}"></td>
                            <td>
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{/achats/{id}(id=${achat.id})}">Détails</a>
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/achats/{id}/edit(id=${achat.id})}">Modifier</a>
                                <a class="btn btn-sm btn-outline-danger" th:href="@{/achats/{id}/delete(id=${achat.id})}" onclick="return confirm('Supprimer cet achat ?')">Supprimer</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(achats)}">
                            <td colspan="5" class="text-center text-muted">Aucun achat enregistré.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
