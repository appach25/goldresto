<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications - Belasyet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link href="/css/main.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container-fluid mt-4 px-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <span th:text="${titre != null ? titre : 'Notifications'}"></span>
                <span th:if="${nonLuesCount > 0}" class="badge bg-danger ms-2" th:text="${nonLuesCount}"></span>
            </h2>
            <div class="btn-group mb-3" role="group">
                <form th:action="@{/notifications/verifier-echeances}" method="post" class="d-inline" sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'OWNER')">
                    <button type="submit" class="btn btn-outline-primary">
                        <i class="bi bi-clock"></i> Vérifier échéances
                    </button>
                </form>
                
                <a href="/notifications/non-lues" class="btn btn-outline-warning">
                    <i class="bi bi-envelope"></i> Non lues
                </a>
                <a href="/notifications" class="btn btn-outline-secondary">
                    <i class="bi bi-list"></i> Toutes
                </a>
                <form th:action="@{/notifications/marquer-toutes-lues}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-primary" th:disabled="${nonLuesCount == 0}">
                        <i class="bi bi-check-all"></i> Marquer tout comme lu
                    </button>
                </form>
            </div>
            
            <div id="apiResult" class="alert alert-info" style="display: none;"></div>
        </div>
        
        <!-- Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <!-- Liste des notifications -->
        <div class="card">
            <div class="card-body">
                <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5">
                    <i class="bi bi-bell-slash display-1 text-muted"></i>
                    <h4 class="mt-3 text-muted">Aucune notification</h4>
                    <p class="text-muted">Vous n'avez aucune notification pour le moment.</p>
                </div>
                
                <div th:if="${!#lists.isEmpty(notifications)}">
                    <div class="list-group">
                        <div th:each="notification : ${notifications}" 
                             class="list-group-item list-group-item-action"
                             th:classappend="${notification.status.name() == 'NON_LU' ? 'bg-light border-start border-4 border-primary' : ''}">
                            
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="flex-grow-1">
                                    <div class="d-flex align-items-center mb-2">
                                        <h6 class="mb-0 me-2" th:text="${notification.titre}"></h6>
                                        <span th:if="${notification.status.name() == 'NON_LU'}" 
                                              class="badge bg-primary">Non lue</span>
                                        <span class="badge bg-secondary ms-2" th:text="${notification.type.libelle}"></span>
                                    </div>
                                    
                                    <p class="mb-2" th:text="${notification.message}"></p>
                                    
                                    <div class="d-flex align-items-center text-muted small">
                                        <i class="bi bi-clock me-1"></i>
                                        <span th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                                        
                                        <span th:if="${notification.reservation != null}" class="ms-3">
                                            <i class="bi bi-calendar-check me-1"></i>
                                            Réservation du <span th:text="${#temporals.format(notification.reservation.dateReservation, 'dd/MM/yyyy')}"></span>
                                        </span>
                                    </div>
                                </div>
                                
                                <div class="d-flex flex-column align-items-end">
                                    <div th:if="${notification.status.name() == 'NON_LU'}" class="btn-group">
                                        <form th:action="@{/notifications/{id}/marquer-lue(id=${notification.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-primary">
                                                <i class="bi bi-check"></i> Marquer comme lu
                                            </button>
                                        </form>
                                        
                                        <a th:href="@{/notifications/{id}/redirect(id=${notification.id})}" 
                                           class="btn btn-sm btn-outline-success">
                                            <i class="bi bi-arrow-right"></i> Voir
                                        </a>
                                    </div>
                                    
                                    <div th:if="${notification.status.name() == 'LU'}" class="text-muted small">
                                        <i class="bi bi-check-circle"></i> Lue le 
                                        <span th:text="${#temporals.format(notification.readAt, 'dd/MM à HH:mm')}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
