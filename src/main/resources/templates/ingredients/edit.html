<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier ingrédient - Belasyet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Modifier ingrédient</h2>
            <a class="btn btn-outline-secondary" th:href="@{/ingredients}">Retour</a>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/ingredients/{id}(id=${ingredient.id})}" method="post" th:object="${ingredient}" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Nom</label>
                        <input type="text" class="form-control" th:field="*{nom}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Unité de stock</label>
                        <select class="form-select" th:field="*{uniteStock}" required>
                            <option value="">Choisir</option>
                            <option value="g">g</option>
                            <option value="kg">kg</option>
                            <option value="ml">ml</option>
                            <option value="l">l</option>
                            <option value="unite">unité</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Stock actuel</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{stockActuel}" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Mettre à jour</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
