<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ingrédients - Belasyet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Catalogue des ingrédients</h2>
        </div>

        <div class="card mb-4">
            <div class="card-header">
                Ajouter un ingrédient
            </div>
            <div class="card-body">
                <form th:action="@{/ingredients}" method="post" th:object="${ingredient}" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Nom</label>
                        <input type="text" class="form-control" th:field="*{nom}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Unité de stock</label>
                        <select class="form-select" th:field="*{uniteStock}" required>
                            <option value="">Choisir</option>
                            <option value="g">g</option>
                            <option value="kg">kg</option>
                            <option value="ml">ml</option>
                            <option value="l">l</option>
                            <option value="unite">unité</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Stock initial</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{stockActuel}" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Liste des ingrédients</div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(ingredients)}" class="text-muted">Aucun ingrédient enregistré.</div>
                <table class="table" th:unless="${#lists.isEmpty(ingredients)}">
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Unité</th>
                            <th>Stock</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${ingredients}">
                            <td th:text="${item.nom}"></td>
                            <td th:text="${item.uniteStock}"></td>
                            <td th:text="${item.stockActuel}"></td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/ingredients/{id}/edit(id=${item.id})}">Modifier</a>
                                <a class="btn btn-sm btn-outline-danger" th:href="@{/ingredients/{id}/delete(id=${item.id})}" onclick="return confirm('Supprimer cet ingrédient ?')">Supprimer</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
