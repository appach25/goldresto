<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calendrier des réservations - Belasyet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link href="/css/main.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container-fluid mt-4 px-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Calendrier des réservations</h2>
            <div class="btn-group">
                <a href="/reservations" class="btn btn-outline-secondary">
                    <i class="bi bi-list"></i> Vue liste
                </a>
                <a href="/reservations/new" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nouvelle réservation
                </a>
            </div>
        </div>
        
        <!-- Debug Info -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Debug Information</h5>
            </div>
            <div class="card-body">
                <p><strong>Current Date:</strong> <span th:text="${currentDate}"></span></p>
                <p><strong>Number of Reservations:</strong> <span th:text="${#lists.size(reservations)}"></span></p>
                <div th:if="${!#lists.isEmpty(reservations)}">
                    <h6>Détail des réservations:</h6>
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Produit</th>
                                <th>Date</th>
                                <th>Quantité</th>
                                <th>Type de date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${reservations}">
                                <td th:text="${r.id}"></td>
                                <td th:text="${r.produit.nomProduit}"></td>
                                <td th:text="${r.dateReservation}"></td>
                                <td th:text="${r.quantite}"></td>
                                <td th:text="${r.dateReservation.class.simpleName}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Simple Calendar Grid -->
        <div class="card">
            <div class="card-header">
                <h5 th:text="${#temporals.format(currentDate, 'MMMM yyyy')}"></h5>
            </div>
            <div class="card-body">
                <!-- Debug: Show all reservations with their formatted dates -->
                <div class="alert alert-info">
                    <h6>Debug des réservations:</h6>
                    <div th:each="r : ${reservations}">
                        <small>
                            Réservation ID <span th:text="${r.id}"></span>: 
                            Date=<span th:text="${r.dateReservation}"></span> | 
                            Formaté=<span th:text="${#temporals.format(r.dateReservation, 'dd-MM-yyyy')}"></span> | 
                            Jour=<span th:text="${#temporals.format(r.dateReservation, 'dd')}"></span>
                        </small><br>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th class="text-center">Dim</th>
                                <th class="text-center">Lun</th>
                                <th class="text-center">Mar</th>
                                <th class="text-center">Mer</th>
                                <th class="text-center">Jeu</th>
                                <th class="text-center">Ven</th>
                                <th class="text-center">Sam</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Calculate first day of month and total days -->
                            <th:block th:with="firstDay=${#temporals.createFromDate(currentDate.year, currentDate.monthValue, 1)},
                                             startDayOfWeek=${#temporals.day(firstDay).dayOfWeek.value == 7 ? 0 : #temporals.day(firstDay).dayOfWeek.value},
                                             totalDays=${#temporals.dayOfMonth(#temporals.createFromDate(currentDate.year, currentDate.monthValue, #temporals.day(firstDay).lengthOfMonth()))}">
                                
                                <!-- Generate 6 weeks of calendar -->
                                <tr th:each="week : ${#numbers.sequence(0, 5)}">
                                    <td th:each="dayOfWeek : ${#numbers.sequence(0, 6)}" 
                                        th:with="dayNumber=${week * 7 + dayOfWeek - startDayOfWeek + 1},
                                                 isValidDay=${dayNumber >= 1 and dayNumber <= totalDays}"
                                        class="calendar-day" style="min-height: 80px; vertical-align: top;">
                                        
                                        <!-- Show day number if it's a valid day -->
                                        <div th:if="${isValidDay}" class="small fw-bold" th:text="${dayNumber}"></div>
                                        
                                        <!-- Show reservations for this day -->
                                        <div th:if="${isValidDay}" th:each="r : ${reservations}" 
                                             th:if="${#temporals.format(r.dateReservation, 'yyyy-MM-dd') == #temporals.format(#temporals.createFromDate(currentDate.year, currentDate.monthValue, dayNumber), 'yyyy-MM-dd')}"
                                             class="badge bg-warning text-dark mb-1" 
                                             style="font-size: 0.7rem;">
                                            <span th:text="${r.produit.nomProduit}"></span> (<span th:text="${r.quantite}"></span>)
                                        </div>
                                    </td>
                                </tr>
                            </th:block>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
