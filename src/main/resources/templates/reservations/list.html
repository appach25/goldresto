<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Réservations - Belasyet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link href="/css/main.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container-fluid mt-4 px-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>
                <i class="bi bi-calendar-check me-2"></i>
                Réservations
                <span class="badge bg-secondary ms-2" th:text="${reservations.size()}">0</span>
            </h4>
            <div>
                <a href="/reservations?view=all" class="btn btn-outline-info me-2">
                    <i class="bi bi-list-ul"></i> Voir toutes
                </a>
                <a href="/reservations/calendar" class="btn btn-outline-secondary">
                    <i class="bi bi-calendar3"></i> Vue calendrier
                </a>
                <a href="/reservations/new" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nouvelle réservation
                </a>
            </div>
        </div>
        
        <!-- Sélecteur de date -->
        <div class="card mb-4">
            <div class="card-body">
                <form method="get" class="row g-3 align-items-end">
                    <div class="col-auto">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" id="date" name="date" class="form-control" th:value="${selectedDate}">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="bi bi-search"></i> Rechercher
                        </button>
                    </div>
                    <div class="col-auto">
                        <a href="/reservations" class="btn btn-outline-secondary">Aujourd'hui</a>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <!-- Liste des réservations -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    Réservations du <span th:text="${#temporals.format(selectedDate, 'dd MMMM yyyy')}"></span>
                </h5>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(reservations)}" class="text-center py-5">
                    <i class="bi bi-calendar-x fs-1 text-muted"></i>
                    <p class="mt-3 text-muted">Aucune réservation pour cette date</p>
                </div>
                
                <div th:unless="${#lists.isEmpty(reservations)}">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Produit</th>
                                    <th>Quantité</th>
                                    <th>Date</th>
                                    <th>Client</th>
                                    <th>Statut</th>
                                    <th>Notes</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="reservation : ${reservations}">
                                    <td>
                                        <span th:text="${reservation.produit.nomProduit}"></span>
                                    </td>
                                    <td>
                                        <span th:text="${reservation.quantite}"></span>
                                    </td>
                                    <td>
                                        <span th:if="${reservation.dateReservation}" 
                                              th:text="${#temporals.format(reservation.dateReservation, 'dd/MM/yyyy')}"></span>
                                        <span th:unless="${reservation.dateReservation}" class="text-muted">-</span>
                                    </td>
                                    <td>
                                        <span th:if="${reservation.client}" th:text="${reservation.client.nomComplet}"></span>
                                        <span th:unless="${reservation.client}" class="text-muted">Non spécifié</span>
                                        <br>
                                        <small class="text-muted" th:if="${reservation.client.telephone}" th:text="${reservation.client.telephone}"></small>
                                    </td>
                                    <td>
                                        <span th:switch="${reservation.status}">
                                            <span th:case="'EN_ATTENTE'" class="badge bg-warning">En attente</span>
                                            <span th:case="'CONFIRMEE'" class="badge bg-info">Confirmée</span>
                                            <span th:case="'ANNULEE'" class="badge bg-danger">Annulée</span>
                                            <span th:case="'TERMINEE'" class="badge bg-success">Terminée</span>
                                        </span>
                                    </td>
                                    <td>
                                        <span th:if="${reservation.notes}" th:text="${reservation.notes}"></span>
                                        <span th:unless="${reservation.notes}" class="text-muted">-</span>
                                    </td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <button th:if="${reservation.status.name() == 'EN_ATTENTE'}"
                                                    class="btn btn-success"
                                                    th:onclick="'confirmReservation(' + ${reservation.id} + ')'">
                                                <i class="bi bi-check"></i>
                                            </button>
                                            <button th:if="${reservation.status.name() == 'CONFIRMEE'}"
                                                    class="btn btn-primary"
                                                    th:onclick="'completeReservation(' + ${reservation.id} + ')'">
                                                <i class="bi bi-check2"></i>
                                            </button>
                                            <button th:if="${reservation.status.name() != 'ANNULEE' and reservation.status.name() != 'TERMINEE'}"
                                                    class="btn btn-danger"
                                                    th:onclick="'cancelReservation(' + ${reservation.id} + ')'">
                                                <i class="bi bi-x"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function confirmReservation(id) {
            if (confirm('Confirmer cette réservation ?')) {
                fetch('/reservations/' + id + '/confirm', {method: 'POST'})
                    .then(() => window.location.reload());
            }
        }
        
        function completeReservation(id) {
            if (confirm('Marquer cette réservation comme terminée ?')) {
                fetch('/reservations/' + id + '/complete', {method: 'POST'})
                    .then(() => window.location.reload());
            }
        }
        
        function cancelReservation(id) {
            if (confirm('Annuler cette réservation ?')) {
                fetch('/reservations/' + id + '/cancel', {method: 'POST'})
                    .then(() => window.location.reload());
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
